<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --void:#07040f; --ink:#eafcff; --pink:#ff2ea6; --cyan:#19f0ff; --violet:#8b5cff;
  --font:'Orbitron','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{
  background:var(--void);color:var(--ink);font-family:var(--font);
  display:flex;justify-content:center;align-items:center;min-height:100vh;min-height:100dvh;
  padding:max(28px,env(safe-area-inset-top)) 20px max(40px,env(safe-area-inset-bottom));
  overflow-x:hidden;
}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.35}
body::before{ /* grid */
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    linear-gradient(transparent 94%,rgba(25,240,255,.10) 95%) 0 0/100% 44px,
    linear-gradient(90deg,transparent 94%,rgba(255,46,166,.08) 95%) 0 0/44px 100%;
}
body::after{ /* scanlines */
  content:"";position:fixed;inset:0;z-index:3;pointer-events:none;
  background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.28) 3px);
}
main{position:relative;z-index:2;width:100%;max-width:440px;margin:0 auto;text-align:center}

.jp{color:var(--pink);font-size:.8rem;letter-spacing:.5em;margin:18px 0 6px;
  text-shadow:0 0 10px var(--pink)}
h1{
  position:relative;display:inline-block;font-size:clamp(4rem,14vw,7.5rem);font-weight:800;
  letter-spacing:.06em;line-height:1;color:var(--ink);
  text-shadow:0 0 8px var(--cyan),0 0 28px var(--cyan),0 0 60px var(--violet);
  animation:flick 6s infinite;
}
h1::before,h1::after{
  content:attr(data-text);position:absolute;inset:0;overflow:hidden;
}
h1::before{color:var(--pink);text-shadow:none;transform:translate(-3px,0);
  clip-path:inset(0 0 55% 0);animation:glitchA 3.2s infinite steps(1)}
h1::after{color:var(--cyan);text-shadow:none;transform:translate(3px,0);
  clip-path:inset(55% 0 0 0);animation:glitchB 3.2s infinite steps(1)}
@keyframes glitchA{0%,90%,100%{transform:translate(0)}92%{transform:translate(-6px,2px)}95%{transform:translate(5px,-2px)}}
@keyframes glitchB{0%,86%,100%{transform:translate(0)}88%{transform:translate(6px,-2px)}93%{transform:translate(-5px,2px)}}
@keyframes flick{0%,96%,100%{opacity:1}97%{opacity:.55}98%{opacity:1}99%{opacity:.7}}

.tag{margin:14px 0 30px;font-size:.78rem;font-weight:500;letter-spacing:.18em;color:var(--cyan);opacity:.85}
.tag span{display:inline-block;width:.6em;height:1em;margin-left:4px;vertical-align:-2px;
  background:var(--cyan);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

section{margin-bottom:26px;text-align:left}
h2{font-size:.78rem;font-weight:500;letter-spacing:.2em;margin:0 0 10px 6px;color:var(--c)}
section.wa{--c:var(--cyan)} section.tg{--c:var(--violet)} section.ig{--c:var(--pink)}

a.btn{
  --c:inherit;
  position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:16px 22px;margin-bottom:12px;border-radius:14px;
  border:1.5px solid var(--c);color:var(--ink);text-decoration:none;
  background:linear-gradient(100deg,rgba(7,4,15,.82),rgba(20,8,40,.82));
  box-shadow:0 0 14px -4px var(--c),inset 0 0 14px -8px var(--c);
  font-weight:500;font-size:.95rem;letter-spacing:.06em;
  transition:transform .15s,box-shadow .15s,background .15s;
  -webkit-tap-highlight-color:transparent;
}
a.btn small{font-size:.72rem;opacity:.7;letter-spacing:.08em}
a.btn:hover,a.btn:active{
  transform:translateX(4px);
  box-shadow:0 0 26px -2px var(--c),inset 0 0 22px -6px var(--c);
  background:linear-gradient(100deg,rgba(7,4,15,.7),color-mix(in srgb,var(--c) 22%,#14082a));
}
a.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wa a.btn{--c:var(--cyan)} .tg a.btn{--c:var(--violet)} .ig a.btn{--c:var(--pink)}

footer{margin-top:34px;font-size:.7rem;letter-spacing:.3em;color:var(--violet);opacity:.8}

@media (min-width:640px) and (max-width:999px){
  main{max-width:540px}
}
@media (min-width:1000px){
  main{max-width:1020px}
  .links{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;align-items:start}
  section{margin-bottom:0}
  a.btn{padding:18px 22px}
}
@media (max-height:520px) and (orientation:landscape){
  .jp{margin-top:0}
  .tag{margin-bottom:18px}
}
@media (prefers-reduced-motion:reduce){
  h1,h1::before,h1::after,.tag span{animation:none}
  a.btn{transition:none}
}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>

<script>
(function(){
  var c=document.getElementById('rain'),x=c.getContext('2d');
  var chars='アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン01'.split('');
  var size=16,cols,drops,w,h;
  function fit(){
    var r=window.devicePixelRatio||1;
    w=innerWidth;h=innerHeight;
    c.width=w*r;c.height=h*r;x.setTransform(r,0,0,r,0,0);
    cols=Math.ceil(w/size);
    drops=[];for(var i=0;i<cols;i++)drops.push(Math.random()*-40);
  }
  fit();addEventListener('resize',fit);
  function draw(){
    x.fillStyle='rgba(7,4,15,.12)';x.fillRect(0,0,w,h);
    x.font=size+'px monospace';
    for(var i=0;i<cols;i++){
      x.fillStyle=(i%3===0)?'#ff2ea6':'#19f0ff';
      x.fillText(chars[Math.floor(Math.random()*chars.length)],i*size,drops[i]*size);
      if(drops[i]*size>h&&Math.random()>.975)drops[i]=0;
      drops[i]+=.6;
    }
  }
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){
    for(var k=0;k<40;k++)draw();
  }else{
    setInterval(draw,50);
  }
})();
</script>
<script>
(function(){
  var a=new Audio('micancion.m4a');
  a.loop=true;a.preload='auto';
  var evs=['pointerdown','pointerup','keydown'];
  function start(){
    var p=a.play();
    if(p&&p.then){
      p.then(function(){
        evs.forEach(function(e){removeEventListener(e,start,true)});
      }).catch(function(){});
    }
  }
  evs.forEach(function(e){addEventListener(e,start,true)});
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden&&a.currentTime>0&&a.paused)a.play().catch(function(){});
  });
})();
</script>

</html>
