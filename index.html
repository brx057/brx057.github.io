<script>
(function(){
  var c=document.getElementById('ash'),x=c.getContext('2d'),w,h,P=[];
  function mk(init){
    return {x:Math.random()*w,y:init?Math.random()*h:-10,r:Math.random()*1.8+.4,
      v:Math.random()*.5+.2,s:Math.random()*6.28,red:Math.random()<.35};
  }
  function fit(){
    var r=window.devicePixelRatio||1;
    w=innerWidth;h=innerHeight;
    c.width=w*r;c.height=h*r;x.setTransform(r,0,0,r,0,0);
    var n=Math.max(40,Math.min(120,Math.round(w*h/14000)));
    P=[];for(var i=0;i<n;i++)P.push(mk(true));
  }
  function draw(){
    x.clearRect(0,0,w,h);
    for(var i=0;i<P.length;i++){
      var p=P[i];
      p.y+=p.v;p.s+=.01;p.x+=Math.sin(p.s)*.4;
      if(p.y>h+10)P[i]=mk(false);
      x.fillStyle=p.red?'rgba(179,18,31,.55)':'rgba(236,228,211,.35)';
      x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill();
    }
  }
  fit();addEventListener('resize',fit);
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){draw();}
  else{(function loop(){draw();requestAnimationFrame(loop)})();}
})();
</script>
<script>
(function(){
  var a=new Audio('micancion.m4a');
  a.loop=true;a.preload='auto';
  var evs=['pointerdown','pointerup','keydown'];
  function start(){
    var p=a.play();
    if(p&&p.then){
      p.then(function(){
        evs.forEach(function(e){removeEventListener(e,start,true)});
      }).catch(function(){});
    }
  }
  evs.forEach(function(e){addEventListener(e,start,true)});
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden&&a.currentTime>0&&a.paused)a.play().catch(function(){});
  });
})();
</script>
<script>
(function(){
  var d=document;
  ['gesturestart','gesturechange','gestureend','selectstart','copy','cut','dragstart'].forEach(function(e){
    d.addEventListener(e,function(ev){ev.preventDefault()});
  });
  addEventListener('wheel',function(ev){if(ev.ctrlKey)ev.preventDefault()},{passive:false});
  addEventListener('keydown',function(ev){
    if((ev.ctrlKey||ev.metaKey)&&['+','-','=','0','c','a','x'].indexOf(ev.key.toLowerCase())>-1)ev.preventDefault();
  });
})();
